# Full stack: MongoDB + API serving the built React app on http://localhost:5000
# Run: docker compose up --build   then seed: docker compose exec api node apps/server/src/seed/index.js
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/vidya
      CLIENT_URL: http://localhost:5000
      COOKIE_SAMESITE: lax
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-replace-me-with-a-long-random-access-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-replace-me-with-a-long-random-refresh-secret}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    volumes:
      - uploads:/app/apps/server/uploads

volumes:
  mongo-data:
  uploads:
